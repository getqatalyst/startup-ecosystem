name: Validate data

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: Validate data/
        run: bun run validate
      - run: bun test
      - name: Build dist/ecosystem.json
        run: bun run build
      - run: bun run lint
