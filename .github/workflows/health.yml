# Monthly link and freshness check: keeps one open issue per province or state listing the
# links to fix and the records due for a re-check (scripts/health.ts). A report, not a gate.
# GitHub turns off scheduled workflows after 60 days with no commits; re-enable it from the
# Actions tab if that happens.

name: Monthly health check

on:
  schedule:
    - cron: "0 13 1 * *" # the 1st, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: Check links and freshness, update the region issues
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/health.ts --post
