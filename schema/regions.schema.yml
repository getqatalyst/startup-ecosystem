# data/regions/index.yml — the countries, provinces or states, and cities with a page.
$schema: https://json-schema.org/draft/2020-12/schema
$id: regions.schema.yml
title: Regions
type: object
additionalProperties: false
required: [countries, subdivisions, cities]
properties:
  countries:
    type: object
    propertyNames: { pattern: "^[a-z]{2}$" }
    additionalProperties: { $ref: "#/$defs/named" }
  subdivisions:
    type: object
    propertyNames: { pattern: "^[a-z]{2}-[a-z0-9]{1,3}$" }
    additionalProperties: { $ref: "#/$defs/named" }
  cities:
    type: object
    propertyNames:
      { pattern: "^[a-z]{2}-[a-z0-9]{1,3}-[a-z0-9]+(-[a-z0-9]+)*$" }
    additionalProperties:
      type: object
      additionalProperties: false
      required: [name, center, zoom, bounds, status, moderators]
      properties:
        name: { type: string, minLength: 1 }
        center: { $ref: "#/$defs/point" }
        zoom: { type: integer, minimum: 1, maximum: 18 }
        bounds:
          description: "[[south, west], [north, east]]"
          type: array
          prefixItems: [{ $ref: "#/$defs/point" }, { $ref: "#/$defs/point" }]
          minItems: 2
          maxItems: 2
        status: { enum: [draft, live] }
        moderators:
          type: array
          items:
            { type: string, pattern: "^@[A-Za-z0-9-]+(/[A-Za-z0-9._-]+)?$" }
$defs:
  named:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: { type: string, minLength: 1 }
  point:
    type: array
    prefixItems:
      - { type: number, minimum: -90, maximum: 90 }
      - { type: number, minimum: -180, maximum: 180 }
    minItems: 2
    maxItems: 2
