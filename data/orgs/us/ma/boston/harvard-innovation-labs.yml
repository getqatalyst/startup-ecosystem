id: harvard-innovation-labs
name: Harvard Innovation Labs
aliases:
  - i-lab
  - Harvard i-lab
url: https://innovationlabs.harvard.edu/
hosts:
  - innovationlabs.harvard.edu
parent: harvard-university
cats:
  - incubator
  - accelerator
  - coworking
hq:
  city: us-ma-boston
  address: 125 Western Ave, Allston, MA 02163
  area: Allston
  lat: 42.3637
  lng: -71.1252
same_as:
