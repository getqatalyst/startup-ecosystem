id: ontario-centre-of-innovation
name: Ontario Centre of Innovation (OCI)
aliases:
  - OCI
url: https://www.oc-innovation.ca/
hosts:
  - www.oc-innovation.ca
cats:
  - funder
hq:
  city: ca-on-toronto
  area: MaRS Centre
  lat: 43.6596
  lng: -79.3886
desc: Ontario-government-funded organization that connects Ontario innovators with researchers, industry partners and funding, including pre-seed co-investment funds, to commercialize made-in-Ontario technology.
last_verified: 2026-10
programs:
  - id: ontario-centre-of-innovation-ready-4-market
    name: Ready 4 Market
    aliases:
      - R4M
    url: https://www.oc-innovation.ca/programs/ready-4-market/
    types:
      - investment
    stages:
      - build
      - operate
    stage_basis: "Ontario-based early-stage technology companies that are raising pre-seed and seed investment rounds."
    audiences:
      - founders
    eligibility:
      affiliation:
        - org_name: An Ontario university, college or research hospital
          role: affiliate
          quote: "Intellectual Property from an Ontario-based academic institution or part of a Campus Incubator/accelerator at Academic Institutes (Companies with their team /IP origins at a university (“university spin-out”), college or research hospital are also eligible, even if not campus affiliated.)"
      place:
        incorporation:
          - ca
        quote: "Incorporated for no more than five years (Ontario or Canadian for-profit incorporation) and have principal operations in Ontario."
      venture:
        - gate: business-age
          quote: "Incorporated for no more than five years (Ontario or Canadian for-profit incorporation) and have principal operations in Ontario."
        - gate: funding-raised
          quote: "Companies that have raised less than $1 million in third-party capital are eligible for their first R4M investment."
      venture_type:
        - for-profit
    open_to:
      - ca-on
    founder_receives:
      - investment
    access: application
