programs:
  - id: the-forum-mentor-program
    name: The Forum Mentor Program
    url: https://www.theforum.ca/mentor-program
    types:
      - mentorship
    stages:
      - validate
      - build
      - operate
      - scale
    stage_basis: "The program is designed for entrepreneurs who are beyond the idea stage of their business and are dedicating their time towards launching, growthing, scaling, or exiting their business."
    audiences:
      - founders
    eligibility:
      who:
        - group: women
          requirement: required
          quote: "You are eligible to register if you are a self-identifying women, non-binary, or trans-femme majority or equal stakeholder, (co)-founder, or (co)-owner actively leading a business operating in Canada; or an employee in line to lead the business who is currently a key decision maker."
          source: https://www.theforum.ca/mentor-program
      place:
        residence:
          - ca
        quote: "You must also be a legal resident of Canada."
    open_to:
      - ca
    delivery: hybrid
    fee: fee
    access: application
    cadence:
      - rolling
    duration: 12 months
    languages:
      - en
      - fr
