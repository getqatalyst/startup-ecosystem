id: futurpreneur
name: Futurpreneur
url: https://futurpreneur.ca/en/
hosts:
  - futurpreneur.ca
  - www.futurpreneur.ca
cats:
  - lender
hq:
  city: ca-on-toronto
desc: National non-profit that gives young entrepreneurs across Canada startup loans, one-on-one mentorship and resources to start or buy a business.
last_verified: 2026-10
review:
  - hq
programs:
  - id: futurpreneur-startup-program
    name: Startup Program
    url: https://futurpreneur.ca/en/offering/core-startup/
    partners:
      - org_name: BDC
        role: funds
    types:
      - loan
      - mentorship
    stages:
      - validate
      - build
    stage_basis: "Your business is not yet operational or has been operating full time for 24 months or less."
    audiences:
      - founders
      - aspiring
    eligibility:
      place:
        residence:
          - ca
        quote: "You are a Canadian citizen or permanent resident of Canada and you physically reside in Canada."
      venture:
        - gate: business-age
          quote: "Your business is not yet operational or has been operating full time for 24 months or less (except Side Hustle)."
      age:
        min: 18
        max: 39
        quote: "You must be between 18 and 39 years old when you submit your application."
    open_to:
      - ca
    equity: false
    founder_receives:
      - loan
    access: application
  - id: futurpreneur-under-30-startup
    name: Under 30 Startup Program
    url: https://futurpreneur.ca/en/under-30/
    variant_of: futurpreneur-startup-program
    last_verified: 2026-10
    partners:
      - org_name: RBC
        role: funds
      - org_name: BDC
        role: funds
    eligibility:
      age:
        min: 18
        max: 29
        quote: "To qualify for U30 financing, you must be between 18 and 29 years old when you submit your application."
  - id: futurpreneur-black-entrepreneur-startup
    name: Black Entrepreneur Startup Program
    url: https://futurpreneur.ca/en/offering/black-entrepreneur-startup/
    variant_of: futurpreneur-startup-program
    last_verified: 2026-10
    eligibility:
      who:
        - group: black
          requirement: required
          quote: "You must self-identify as Black"
          source: https://futurpreneur.ca/en/offering/black-entrepreneur-startup/
  - id: futurpreneur-indigenous-entrepreneur-startup
    name: Indigenous Entrepreneur Startup Program
    url: https://futurpreneur.ca/en/offering/indigenous-entrepreneur-startup/
    variant_of: futurpreneur-startup-program
    last_verified: 2026-10
    partners:
      - org_name: RBC Origins
        role: funds
    eligibility:
      who:
        - group: indigenous
